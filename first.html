<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
</head>

<body>
    <h1 align="center">Booking Form</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>Hotel Room Booking Form</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required><br><br>

            <label for="date">Check-in Date:</label>
            <input type="date" id="date" name="checkindate" required><br><br>

            <label for="date">Checkout Date:</label>
            <input type="date" id="date" name="checkoutdate" required><br><br>

            <label for="room">Room Type:</label>
            <select id="room" name="room">
                <option>Single Room</option>
                <option>Double Room</option>
                <option>Deluxe Room</option>
                <option>Family Room</option>
            </select>
            <br><br>

            <label for="guests">Number of Guests:</label>
            <input type="number" id="guests" name="guests" min="1" required><br><br>

            <label for="requests">Special Requests:</label>
            <br>
            <textarea id="requests" name="requests" rows="4" cols="30"></textarea>
            <br><br>

            <input type="submit" value="Book Now">
            <input type="reset" value="Reset Form">
        </fieldset>
    </form>
</body>

</html>
